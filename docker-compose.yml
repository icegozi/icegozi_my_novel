services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: development
    container_name: icegozi-novel-app
    restart: unless-stopped
    working_dir: /var/www
    environment:
      CONTAINER_ROLE: app
      APP_ENV: local
      APP_DEBUG: "true"
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: icegozi_novel
      DB_USERNAME: novel_user
      DB_PASSWORD: novel_secret_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AUTORUN_MIGRATIONS: "false"
    volumes:
      - ./:/var/www
      - /var/www/vendor
      - /var/www/public/build
    networks:
      - app-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: icegozi-novel-web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www:ro
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app-network
    depends_on:
      - app

  queue-worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: development
    container_name: icegozi-novel-worker
    restart: unless-stopped
    working_dir: /var/www
    environment:
      CONTAINER_ROLE: worker
      APP_ENV: local
      DB_HOST: mysql
      REDIS_HOST: redis
    volumes:
      - ./:/var/www
      - /var/www/vendor
    networks:
      - app-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    container_name: icegozi-novel-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_secret_password
      MYSQL_DATABASE: icegozi_novel
      MYSQL_USER: novel_user
      MYSQL_PASSWORD: novel_secret_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_secret_password"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: icegozi-novel-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  app-network:
    driver: bridge

volumes:
  db_data:
    driver: local
  redis_data:
    driver: local
