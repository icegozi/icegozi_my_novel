server {
    listen 80;
    listen [::]:80;
    server_name localhost;
    root /var/www/public;

    # 3D/GLB and Avatar scene uploads (up to 64MB)
    client_max_body_size 64M;
    client_body_buffer_size 128k;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    index index.php index.html;
    charset utf-8;

    # Direct health check pass-through to Laravel /up endpoint
    location /up {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        include fastcgi_params;
        access_log off;
    }

    # Standard Laravel routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Static assets caching (including 3D models and fonts)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|glb|gltf|bin|woff|woff2|ttf|svg|webp|avif)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # FastCGI execution for PHP scripts
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Tuning FastCGI buffers
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
        fastcgi_busy_buffers_size 64k;
        fastcgi_temp_file_write_size 64k;
        fastcgi_read_timeout 120s;
        fastcgi_send_timeout 120s;
    }

    # Block access to hidden dotfiles (except ACME challenge)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
